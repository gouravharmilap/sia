<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span class="name">Sia</span>
        <img src="logo.png" alt="Micro Nova" class="logo" />
      </div>
      <div class="actions">
        <button id="clearBtn" class="ghost" title="Clear chat">Clear</button>
      </div>
    </header>

    <main id="chat" class="chat">
      <div class="welcome">
        <h1>Sia.</h1>
        <p>Talk. I'll keep it short.</p>
        <p class="hint">One line. Go.</p>
      </div>
    </main>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="Talk." autocomplete="off"></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
